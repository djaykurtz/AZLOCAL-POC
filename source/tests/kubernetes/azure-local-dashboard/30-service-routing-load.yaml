apiVersion: batch/v1
kind: Job
metadata:
  name: azure-local-dashboard-routing-load
  namespace: azure-local-dashboard
  labels:
    app.kubernetes.io/name: azure-local-dashboard-routing-load
    app.kubernetes.io/part-of: azure-local-dashboard
  annotations:
    poc.azurelocal.example.com/purpose: "bounded-in-cluster-service-routing-test"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-local-dashboard-routing-load
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: mcr.microsoft.com/azure-cli:latest
          command:
            - python3
            - -c
            - |
              import collections
              import json
              import time
              import urllib.request

              url = "http://azure-local-dashboard.azure-local-dashboard.svc.cluster.local/api/work"
              responses = collections.Counter()
              failures = []

              for request_number in range(90):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Connection": "close",
                          "X-Request-ID": f"routing-load-{request_number:03d}",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      responses[payload["pod"]] += 1
                  except Exception as error:
                      failures.append(str(error))
                  time.sleep(0.1)

              print(json.dumps({
                  "requests": 90,
                  "successes": sum(responses.values()),
                  "failures": len(failures),
                  "responsesByPod": dict(sorted(responses.items())),
                  "failureSamples": failures[:3],
              }))
              raise SystemExit(0 if not failures else 1)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi