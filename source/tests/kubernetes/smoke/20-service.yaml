apiVersion: v1
kind: Service
metadata:
  name: hello-azloc
  namespace: azloc-poc-smoke
  labels:
    app.kubernetes.io/name: hello-azloc
    app.kubernetes.io/part-of: azure-local-poc
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: hello-azloc
  ports:
    - name: http
      port: 80
      targetPort: http