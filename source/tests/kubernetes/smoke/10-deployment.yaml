apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-azloc
  namespace: azloc-poc-smoke
  labels:
    app.kubernetes.io/name: hello-azloc
    app.kubernetes.io/part-of: azure-local-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-azloc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-azloc
        app.kubernetes.io/part-of: azure-local-poc
    spec:
      containers:
        - name: web
          image: mcr.microsoft.com/azuredocs/aci-helloworld:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10